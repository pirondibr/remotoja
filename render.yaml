# Workers Minha Vaga Remota no Render (landing fica na Vercel)
# Nomes dos services (remotoja-*) mantidos para não recriar no Render.
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: cron
    name: remotoja-scraper-cron
    runtime: python
    schedule: "0 */6 * * *"
    buildCommand: pip install -r workers/requirements.txt
    startCommand: python -m workers.scraper.google_jobs --keyword "vagas de seo home office"
    plan: starter

